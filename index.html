    <title>六六篮球计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-orange: #ff6b35;
            --accent-orange-glow: rgba(255, 107, 53, 0.4);
            --accent-blue: #0f3460;
            --accent-cyan: #00d9ff;
            --accent-green: #00e676;
            --accent-red: #ff3d56;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #6c6c80;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }

        /* ========== Header ========== */
        .header {
            text-align: center;
            padding: 10px 20px 4px;
            position: relative;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ========== Sound Wave Indicator ========== */
        .sound-wave {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            height: 24px;
            margin: 4px 0;
            padding: 0 30px;
        }

        .sound-wave .bar {
            width: 3px;
            background: linear-gradient(to top, var(--accent-orange), var(--accent-cyan));
            border-radius: 2px;
            height: 3px;
            transition: height 0.05s ease;
            opacity: 0.6;
        }

        .sound-wave.active .bar {
            opacity: 1;
        }

        /* ========== Main Display ========== */
        .main-display {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 4px 16px;
        }

        /* Timer Display */
        .timer-section {
            width: 100%;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 10px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .timer-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-orange));
        }

        .timer-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 32px;
            font-weight: 200;
            font-family: 'SF Mono', 'Fira Code', monospace;
            letter-spacing: 1px;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .timer-display .ms {
            font-size: 20px;
            color: var(--text-muted);
        }

        .timer-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 6px;
        }

        .timer-stat {
            text-align: center;
        }

        .timer-stat .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .timer-stat .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* Count Display */
        .count-section {
            width: 100%;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .count-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-red));
        }

        .count-section.pulse {
            animation: pulseGlow 0.4s ease;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 var(--accent-orange-glow); }
            50% { box-shadow: 0 0 30px 10px var(--accent-orange-glow); }
            100% { box-shadow: 0 0 0 0 var(--accent-orange-glow); }
        }

        .count-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .count-number {
            font-size: 64px;
            font-weight: 800;
            font-family: 'SF Mono', 'Fira Code', monospace;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-orange), #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--accent-orange-glow);
        }

        .count-number.pop {
            animation: countPop 0.3s ease;
        }

        @keyframes countPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .count-rate {
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .count-rate span {
            color: var(--accent-green);
            font-weight: 600;
        }

        /* ========== Controls ========== */
        .controls {
            padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange), #ff8c42);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
        }

        .btn-primary.active {
            background: linear-gradient(135deg, var(--accent-red), #ff6b6b);

    </style>
</head>
<body>
    <div class="app">
        <!-- Flash overlay for visual feedback -->
        <div class="flash-overlay" id="flashOverlay"></div>

        <!-- Header -->
        <div class="header">
            <h1>六六篮球计数器</h1>
            <div class="subtitle">声音识别 · 智能计数</div>
            <div style="margin-top: 6px;">
                <span class="status-badge" id="statusBadge">
                    <span class="dot"></span>
                    <span id="statusText">未开始</span>
                </span>
            </div>
        </div>

        <!-- Sound Wave Visualization -->
        <div class="sound-wave" id="soundWave">
            <!-- bars will be generated by JS -->
        </div>

        <!-- Main Display -->
        <div class="main-display">
            <!-- Timer -->
            <div class="timer-section">
                <div class="timer-label">计时器</div>
                <div class="timer-display" id="timerDisplay">
                    00:00<span class="ms">.0</span>
                </div>
                <div class="timer-stats">
                    <div class="timer-stat">
                        <div class="stat-value" id="avgRate">0.0</div>
                        <div class="stat-label">拍/秒</div>
                    </div>
                    <div class="timer-stat">
                        <div class="stat-value" id="bestStreak">0</div>
                        <div class="stat-label">最长连击</div>
                    </div>
                    <div class="timer-stat">
                        <div class="stat-value" id="totalTime">0s</div>
                        <div class="stat-label">总时长</div>
                    </div>
                </div>
            </div>

            <!-- Count -->
            <div class="count-section" id="countSection">
                <div class="count-label">拍 球 次 数</div>
                <div class="count-number" id="countNumber">0</div>
                <div class="count-rate">当前频率: <span id="currentRate">0.0</span> 次/秒</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <!-- Main buttons -->
            <div class="btn-row">
                <button class="btn btn-primary" id="startBtn">
                    <span class="btn-icon">▶</span>
                    <span id="startBtnText">开始</span>
                </button>
                <button class="btn btn-secondary" id="resetBtn">

            </div>

            <!-- Small buttons -->
            <div class="btn-row-small">
                <button class="btn btn-secondary btn-small" id="manualBtn">
                    手动+1
                </button>
                <button class="btn btn-secondary btn-small" id="undoBtn">
                    撤销-1
                </button>
                <button class="btn btn-secondary btn-small" id="recordBtn">
                    历史记录
                </button>
            </div>
        </div>

        <!-- Session Record Modal -->
        <div class="record-list" id="recordModal">
            <div class="record-sheet">
                <h2>历史记录</h2>
                <div id="recordListContent"></div>
                <button class="record-close" id="recordCloseBtn">关闭</button>
            </div>
        </div>


        <!-- Safari Hint -->
        <div id="safariHint" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:999; display:flex; align-items:center; justify-content:center; padding:40px;">
            <div style="text-align:center; max-width:320px;">
                <div style="font-size:48px; margin-bottom:16px;">🏐</div>
                <h2 style="font-size:18px; margin-bottom:12px; color:#ff6b35;">请在 Safari 中打开</h2>
                <p style="font-size:14px; color:#a0a0b8; line-height:1.6; margin-bottom:20px;">
                    微信/QQ等内置浏览器不支持麦克风权限。<br><br>
                    请点击右上角 <strong style="color:#00d9ff;">•••</strong><br>
                    选择 <strong style="color:#00d9ff;">在 Safari 中打开</strong><br><br>
                    然后在 Safari 中点击 <strong style="color:#00d9ff;">分享 → 添加到主屏幕</strong> 即可像App一样使用。
                </p>
                <button onclick="document.getElementById('safariHint').style.display='none'" style="padding:10px 30px; background:#16213e; border:1px solid rgba(255,255,255,0.2); border-radius:12px; color:#fff; font-size:14px; cursor:pointer;">我知道了</button>
            </div>
        </div>
        <script>
            (function() {
                const ua = navigator.userAgent.toLowerCase();
                const isWeChat = ua.includes('micromessenger');
                const isQQ = ua.includes('qq/') && !ua.includes('qqbrowser');
                if (isWeChat || isQQ) {
                    document.getElementById('safariHint').style.display = 'flex';
                }
            })();
        </script>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ========== State ==========
        const state = {
            isListening: false,
            count: 0,
            startTime: 0,
            elapsedTime: 0,
            timerInterval: null,
            lastHitTime: 0,
            hitTimestamps: [],
            streak: 0,
            bestStreak: 0,
            lastStreakTime: 0,
            records: [],
            // Audio
            audioContext: null,
            analyser: null,
            analyserRaw: null,
            microphone: null,
            mediaStream: null,
            dataArray: null,
            rawArray: null,
            isProcessing: false,
            // Detection
            noiseFloor: 0,          // running noise floor (low-freq band)
            noiseFloorFull: 0,      // running noise floor (full spectrum)
            calibrated: false,
            noiseSamples: [],
            // Peak detection
            lastHitMs: 0,           // timestamp of last confirmed hit
            minCooldown: 55,        // ms — allows up to ~18 hits/sec
            inPeakWindow: false,
            peakWindowStart: 0,
            peakWindowMax: 0,
            // Energy ratio history for voice rejection
            prevEnergy: 0,
        };

        // Sensitivity: lower multiplier = more sensitive (triggers at lower energy)
        // Fixed parameters — tuned for very close-range detection:
        // Phone placed right next to the basketball; very high energy threshold rejects voice.
        // minEnergy: 0.14 — only very loud, very close sounds trigger
        // multiplier: 1.2 — low dynamic threshold (absolute gate does the heavy lifting)
        // ratioReq: 0.75 — strict low-freq energy ratio
        const DETECT_CONFIG = {
            multiplier: 1.2,
            minEnergy: 0.14,
            ratioReq: 0.75,
        };

        // Bounce detection frequency bands:
        // Bounce core: 80-400 Hz (the "thud" — ball hitting surface)
        // We compute energy ratio: (80-400Hz energy) / (80-3000Hz energy)
        // Bounce: ratio > 0.70 (energy concentrated in low freqs)
        // Voice: ratio < 0.55 (energy spread across harmonics up to 3kHz+)
        const BOUNCE_CORE_MIN = 80;
        const BOUNCE_CORE_MAX = 400;
        const FULL_BAND_MAX = 3000;

        // ========== DOM Elements ==========
        const els = {
            startBtn: document.getElementById('startBtn'),
            startBtnText: document.getElementById('startBtnText'),
            resetBtn: document.getElementById('resetBtn'),
            manualBtn: document.getElementById('manualBtn'),
            undoBtn: document.getElementById('undoBtn'),
            recordBtn: document.getElementById('recordBtn'),
            countNumber: document.getElementById('countNumber'),
            countSection: document.getElementById('countSection'),
            timerDisplay: document.getElementById('timerDisplay'),
            currentRate: document.getElementById('currentRate'),
            avgRate: document.getElementById('avgRate'),
            bestStreak: document.getElementById('bestStreak'),
            totalTime: document.getElementById('totalTime'),
            statusBadge: document.getElementById('statusBadge'),
            statusText: document.getElementById('statusText'),
            soundWave: document.getElementById('soundWave'),
            flashOverlay: document.getElementById('flashOverlay'),
            toast: document.getElementById('toast'),
            recordModal: document.getElementById('recordModal'),
            recordListContent: document.getElementById('recordListContent'),
            recordCloseBtn: document.getElementById('recordCloseBtn'),
        };

        // ========== Sound Wave Bars ==========
        const WAVE_BAR_COUNT = 40;
        const waveBars = [];
        for (let i = 0; i < WAVE_BAR_COUNT; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            els.soundWave.appendChild(bar);
            waveBars.push(bar);
        }

        // ========== Toast ==========
        function showToast(msg, duration = 2000) {
            els.toast.textContent = msg;
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), duration);
        }

        // ========== Timer ==========
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const tenths = Math.floor((ms % 1000) / 100);
            return {
                main: `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`,
                ms: tenths,
                total: `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`
            };
        }

        function updateTimer() {
            if (state.isListening) {
                state.elapsedTime = Date.now() - state.startTime;
            }
            const t = formatTime(state.elapsedTime);
            els.timerDisplay.innerHTML = `${t.main}<span class="ms">.${t.ms}</span>`;

            // Update total time
            const totalSec = Math.floor(state.elapsedTime / 1000);
            if (totalSec < 60) {
                els.totalTime.textContent = `${totalSec}s`;
            } else {
                const m = Math.floor(totalSec / 60);
                const s = totalSec % 60;
                els.totalTime.textContent = `${m}m${s}s`;
            }

            // Update average rate
            if (state.elapsedTime > 0) {
                const avg = (state.count / (state.elapsedTime / 1000)).toFixed(1);
                els.avgRate.textContent = avg;
            }

            // Update current rate (last 5 seconds)
            const now = Date.now();
            const recentHits = state.hitTimestamps.filter(ts => now - ts < 5000);
            if (recentHits.length > 0) {
                const timeRange = (now - recentHits[0]) / 1000;
                const rate = timeRange > 0 ? (recentHits.length / timeRange).toFixed(1) : '0.0';
                els.currentRate.textContent = rate;
            } else {
                els.currentRate.textContent = '0.0';
            }

            // Streak: if no hit for 2 seconds, reset streak
            if (state.streak > 0 && now - state.lastStreakTime > 2000) {
                state.streak = 0;
            }
        }

        // ========== Count ==========
        function incrementCount() {
            state.count++;
            const now = Date.now();

            // Record hit timestamp
            state.hitTimestamps.push(now);
            // Keep only last 100 hits
            if (state.hitTimestamps.length > 100) {
                state.hitTimestamps.shift();
            }

            // Streak logic
            if (now - state.lastStreakTime < 1500) {
                state.streak++;
            } else {
                state.streak = 1;
            }
            state.lastStreakTime = now;

            if (state.streak > state.bestStreak) {
                state.bestStreak = state.streak;
                els.bestStreak.textContent = state.bestStreak;
            }

            // Update display
            els.countNumber.textContent = state.count;
            els.countNumber.classList.remove('pop');
            void els.countNumber.offsetWidth; // trigger reflow
            els.countNumber.classList.add('pop');

            els.countSection.classList.remove('pulse');
            void els.countSection.offsetWidth;
            els.countSection.classList.add('pulse');

            // Flash overlay
            els.flashOverlay.classList.add('flash');
            setTimeout(() => els.flashOverlay.classList.remove('flash'), 150);
        }

        function decrementCount() {
            if (state.count > 0) {
                state.count--;
                els.countNumber.textContent = state.count;
            }
        }

        // ========== Audio Detection ==========

        async function initAudio() {
            try {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sampleRate = state.audioContext.sampleRate;

                state.mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    }
                });

                state.microphone = state.audioContext.createMediaStreamSource(state.mediaStream);

                // --- Single analyser on raw mic (we do frequency analysis in JS) ---
                state.analyser = state.audioContext.createAnalyser();
                state.analyser.fftSize = 2048;
                state.analyser.smoothingTimeConstant = 0.15;
                state.microphone.connect(state.analyser);

                // Visualization analyser (smoothed)
                state.analyserRaw = state.audioContext.createAnalyser();
                state.analyserRaw.fftSize = 512;
                state.analyserRaw.smoothingTimeConstant = 0.6;
                state.microphone.connect(state.analyserRaw);

                state.dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                state.rawArray = new Uint8Array(state.analyserRaw.frequencyBinCount);
                state.sampleRate = sampleRate;
                state.binWidth = sampleRate / state.analyser.fftSize;

                // Precompute bin indices for frequency bands
                state.coreStartBin = Math.floor(BOUNCE_CORE_MIN / state.binWidth);
                state.coreEndBin = Math.min(Math.ceil(BOUNCE_CORE_MAX / state.binWidth), state.analyser.frequencyBinCount - 1);
                state.fullEndBin = Math.min(Math.ceil(FULL_BAND_MAX / state.binWidth), state.analyser.frequencyBinCount - 1);

                return true;
            } catch (err) {
                console.error('Audio init error:', err);
                showToast('无法访问麦克风，请检查权限');
                return false;
            }
        }

        // Compute energy in a frequency range from spectrum data
        function bandEnergy(freqData, startBin, endBin) {
            let sum = 0;
            let count = 0;
            for (let i = startBin; i <= endBin; i++) {
                const amp = freqData[i] / 255;
                sum += amp * amp;
                count++;
            }
            return count > 0 ? sum / count : 0;  // mean squared amplitude
        }

        // ========== Main Detection Loop ==========
        //
        // Strategy:
        // 1. Get full spectrum (2048 FFT → fine frequency resolution)
        // 2. Compute energy in core band (80-400Hz) and full band (80-3000Hz)
        // 3. Energy ratio = core / full — bounce has ratio > 0.65, voice < 0.55
        // 4. When core energy exceeds dynamic threshold AND ratio is high enough → hit
        // 5. Short cooldown (55ms) to allow fast consecutive hits
        // 6. Running noise floor updates continuously (adapts to environment)
        //
        function detectBounce() {
            if (!state.isProcessing) return;

            const nowMs = performance.now();

            // Get spectrum data
            state.analyser.getByteFrequencyData(state.dataArray);

            // Visualization
            state.analyserRaw.getByteFrequencyData(state.rawArray);
            updateWaveDisplay(state.rawArray);

            // --- Compute energies ---
            const coreEnergy = bandEnergy(state.dataArray, state.coreStartBin, state.coreEndBin);
            const fullEnergy = bandEnergy(state.dataArray, state.coreStartBin, state.fullEndBin);

            // Energy ratio: how much of the low-mid energy is in the core bounce band
            const energyRatio = fullEnergy > 0.0001 ? coreEnergy / fullEnergy : 0;

            // --- Calibration phase (first ~0.7s) ---
            if (!state.calibrated) {
                state.noiseSamples.push(coreEnergy);
                if (state.noiseSamples.length > 40) {
                    const sorted = [...state.noiseSamples].sort((a, b) => a - b);
                    state.noiseFloor = sorted[Math.floor(sorted.length * 0.75)]; // 75th percentile
                    state.noiseFloor = Math.max(state.noiseFloor, 0.002);
                    state.calibrated = true;
                }
                requestAnimationFrame(detectBounce);
                return;
            }

            // --- Continuous noise floor tracking ---
            // If current energy is below threshold range, update noise floor slowly
            const cfg = DETECT_CONFIG;
            const threshold = state.noiseFloor * cfg.multiplier + cfg.minEnergy;
            if (coreEnergy < threshold * 0.6) {
                // Quiet frame — update noise floor with slow EMA
                state.noiseFloor = state.noiseFloor * 0.97 + coreEnergy * 0.03;
                state.noiseFloor = Math.max(state.noiseFloor, 0.002);
            }

            // --- Peak detection ---
            const cooldownOk = nowMs - state.lastHitMs > state.minCooldown;

            if (cooldownOk && coreEnergy > threshold && coreEnergy > cfg.minEnergy) {

                // Spectral check: bounce energy should be concentrated in low freqs
                // Voice has lots of harmonic energy in 400-3000Hz, so ratio is lower
                const ratioOk = energyRatio > cfg.ratioReq;

                if (ratioOk) {
                    // Additional check: sharp attack — energy must have jumped up suddenly
                    // Compare to previous frame's energy
                    const energyJump = state.prevEnergy > 0 ? coreEnergy / state.prevEnergy : 10;
                    const isSharpAttack = energyJump > 1.4; // energy at least 1.4x previous frame

                    if (isSharpAttack) {
                        state.lastHitMs = nowMs;
                        incrementCount();
                    }
                }
            }

            // Store previous energy for attack detection
            state.prevEnergy = coreEnergy;

            requestAnimationFrame(detectBounce);
        }

        function confirmHit(nowMs) {
            state.lastHitMs = nowMs;
            incrementCount();
        }

        function updateWaveDisplay(freqData) {
            const step = Math.floor(freqData.length / WAVE_BAR_COUNT);
            for (let i = 0; i < WAVE_BAR_COUNT; i++) {
                const value = freqData[i * step] || 0;
                const height = Math.max(3, (value / 255) * 24);
                waveBars[i].style.height = `${height}px`;
            }
        }

        // ========== Start / Stop ==========
        async function toggleStart() {
            if (state.isListening) {
                stopListening();
            } else {
                await startListening();
            }
        }

        async function startListening() {
            // Resume audio context (needed for mobile)
            if (state.audioContext && state.audioContext.state === 'suspended') {
                await state.audioContext.resume();
            }

            if (!state.audioContext) {
                const ok = await initAudio();
                if (!ok) return;
            }

            // Reset detection state
            state.calibrated = false;
            state.noiseSamples = [];
            state.noiseFloor = 0;
            state.lastHitMs = 0;
            state.prevEnergy = 0;

            // Start
            state.isListening = true;
            state.isProcessing = true;
            if (state.count === 0 || state.elapsedTime === 0) {
                state.startTime = Date.now();
                state.elapsedTime = 0;
            } else {
                // Resume timer
                state.startTime = Date.now() - state.elapsedTime;
            }

            state.timerInterval = setInterval(updateTimer, 100);
            detectBounce();

            // UI
            els.startBtnText.textContent = '停止';
            els.startBtn.classList.add('active');
            els.startBtn.querySelector('.btn-icon').textContent = '■';
            els.statusText.textContent = '正在监听...';
            els.statusBadge.classList.add('listening');
            els.soundWave.classList.add('active');

            showToast('开始监听拍球声音');
        }

        function stopListening() {
            state.isListening = false;
            state.isProcessing = false;

            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            // Save record
            if (state.count > 0) {
                saveRecord();
            }

            // UI
            els.startBtnText.textContent = '继续';
            els.startBtn.classList.remove('active');
            els.startBtn.querySelector('.btn-icon').textContent = '▶';
            els.statusText.textContent = '已暂停';
            els.statusBadge.classList.remove('listening');
            els.soundWave.classList.remove('active');

            // Reset wave bars
            waveBars.forEach(bar => bar.style.height = '4px');

            showToast('已停止');
        }

        function resetAll() {
            stopListening();

            state.count = 0;
            state.elapsedTime = 0;
            state.hitTimestamps = [];
            state.streak = 0;
            state.bestStreak = 0;
            state.lastHitTime = 0;
            state.lastHitMs = 0;
            state.noiseFloor = 0;
            state.prevEnergy = 0;
            state.calibrated = false;
            state.noiseSamples = [];

            els.countNumber.textContent = '0';
            els.timerDisplay.innerHTML = '00:00<span class="ms">.0</span>';
            els.currentRate.textContent = '0.0';
            els.avgRate.textContent = '0.0';
            els.bestStreak.textContent = '0';
            els.totalTime.textContent = '0s';

            els.startBtnText.textContent = '开始';
            els.startBtn.querySelector('.btn-icon').textContent = '▶';
            els.statusText.textContent = '未开始';

            showToast('已重置');
        }

        // ========== Records ==========
        function saveRecord() {
            const t = formatTime(state.elapsedTime);
            state.records.unshift({
                count: state.count,
                duration: t.total,
                durationMs: state.elapsedTime,
                date: new Date().toLocaleString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                rate: (state.count / (state.elapsedTime / 1000)).toFixed(1),
            });

            if (state.records.length > 50) {
                state.records = state.records.slice(0, 50);
            }
        }

        function showRecords() {
            if (state.records.length === 0) {
                els.recordListContent.innerHTML = '<div class="record-empty">暂无历史记录</div>';
            } else {
                els.recordListContent.innerHTML = state.records.map(r => `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-count">${r.count} 次</div>
                            <div class="record-time">${r.date}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="record-duration">${r.duration}</div>
                            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${r.rate} 次/秒</div>
                        </div>
                    </div>
                `).join('');
            }
            els.recordModal.classList.add('show');
        }

        // ========== Event Listeners ==========
        els.startBtn.addEventListener('click', toggleStart);
        els.resetBtn.addEventListener('click', resetAll);
        els.manualBtn.addEventListener('click', () => {
            incrementCount();
            if (!state.isListening) {
                // Also start timer if not running
                if (state.elapsedTime === 0) {
                    state.startTime = Date.now();
                    state.timerInterval = setInterval(updateTimer, 100);
                }
            }
        });
        els.undoBtn.addEventListener('click', decrementCount);
        els.recordBtn.addEventListener('click', showRecords);
        els.recordCloseBtn.addEventListener('click', () => els.recordModal.classList.remove('show'));
        els.recordModal.addEventListener('click', (e) => {
            if (e.target === els.recordModal) els.recordModal.classList.remove('show');
        });

        // Prevent body scroll on mobile
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.record-sheet')) return;
            e.preventDefault();
        }, { passive: false });

        // Initialize

        // ========== Service Worker Registration (inline) ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = "const CACHE_NAME = 'basketball-counter-v1';\nconst ASSETS = [\n    './',\n    './index.html',\n    './manifest.json',\n    './icon-192.png',\n    './icon-512.png',\n    './apple-touch-icon.png',\n];\n\n// Install: cache all assets\nself.addEventListener('install', (event) => {\n    event.waitUntil(\n        caches.open(CACHE_NAME).then((cache) => {\n            return cache.addAll(ASSETS);\n        }).then(() => {\n            return self.skipWaiting();\n        })\n    );\n});\n\n// Activate: clean up old caches\nself.addEventListener('activate', (event) => {\n    event.waitUntil(\n        caches.keys().then((cacheNames) => {\n            return Promise.all(\n                cacheNames.filter((name) => name !== CACHE_NAME)\n                    .map((name) => caches.delete(name))\n            );\n        }).then(() => {\n            return self.clients.claim();\n        })\n    );\n});\n\n// Fetch: cache-first strategy (offline support)\nself.addEventListener('fetch', (event) => {\n    event.respondWith(\n        caches.match(event.request).then((response) => {\n            if (response) {\n                return response;\n            }\n            return fetch(event.request).then((response) => {\n                // Cache new requests for same-origin\n                if (response && response.status === 200 && event.request.url.startsWith(self.location.origin)) {\n                    const responseClone = response.clone();\n                    caches.open(CACHE_NAME).then((cache) => {\n                        cache.put(event.request, responseClone);\n                    });\n                }\n                return response;\n            }).catch(() => {\n                // Offline fallback\n                if (event.request.destination === 'document') {\n                    return caches.match('./index.html');\n                }\n            });\n        })\n    );\n});\n";
                try {
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl)
                        .then((reg) => { console.log('SW registered:', reg.scope); })
                        .catch((err) => {
                            try {
                                const dataUrl = 'data:application/javascript,' + encodeURIComponent(swCode);
                                navigator.serviceWorker.register(dataUrl).catch(() => {});
                            } catch(e) {}
                        });
                } catch(e) {}
            });
        }

        // ========== Prevent iOS double-tap zoom ==========
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // ========== Prevent iOS pinch zoom ==========
        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
